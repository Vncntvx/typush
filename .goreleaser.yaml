# GoReleaser config for typush. Replaces cargo-dist (dist-workspace.toml).
version: 2

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./...

builds:
  - id: typush
    main: .
    binary: typush
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz, zip]
    files:
      - README.md
      - README.en.md
      - LICENSE*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  use: github

brews:
  - repository:
      owner: Vncntvx
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/Vncntvx/typush
    description: Package manager for Typst
    license: MIT
    test: |
      system "#{bin}/typush", "--version"

nfpms: []
snapcrafts: []
scoops: []
